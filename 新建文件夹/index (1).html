 ],

 instagram:'https://www.instagram.com/axora_lighting/',
 weixin1:'https://weixin.qq.com/sph/AM2txspSL0',

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deco=(s,pos,cl='star')=>`<span aria-hidden="true" class="deco ${cl}" style="${pos}">${s}</span>`;
const stickers=(side,n)=>{const a={01:['stamp','ribbonbow'],02:['cookie','flower'],03:['stamp','heart'],04:['check','ribbonbow']}[n]||['stamp','heart'];const kind=side==='left'?a[0]:a[1];const contents={stamp:'✿<small>POSTAL</small>',ribbonbow:'୨୧',cookie:'♥',flower:'✿',heart:'♥',check:'♡ handmade'};return `<div aria-hidden="true" class="scrap-sticker ${kind} sticker-bottom"><span class="sticker-inner">${contents[kind]}</span></div>`};
const leaf=(text,side,n)=>`<section class="leaf ${side}"><div class="mobile-note">${side==='left'?'LEFT':'RIGHT'} PAGE</div>${text}${stickers(side,n)}<span class="page-number">${n} · 04</span></section>`;

function one(){let l=`${deco('★','top:35px;right:40px')}${deco('☘','bottom:55px;right:35px','flower')}<div class="eyebrow">01 / ABOUT ME</div><h1>你好，我是<br><span style="color:var(--wine)">陈安琪。</span></h1><span class="ribbon">CONTENT · SOCIAL MEDIA · VIDEO</span><p class="intro">一名兼具海外社媒内容实践、英文表达与视觉创作能力的内容运营新人，擅长将想法转化为可发布的品牌内容。</p><div class="line"></div><div class="strength"><b>海外平台内容运营</b><p>实践 Facebook、Instagram、LinkedIn 等平台的英文文案、内容排版及品牌推广。</p></div><div class="strength"><b>独立内容制作</b><p>具备短视频策划、拍摄、剪辑及图文制作能力，可独立完成从创意到发布的流程。</p></div><div class="strength"><b>沟通与项目执行</b><p>有活动组织、实地调研和跨团队协作经验，适应快节奏任务。</p></div><div class="chips"><span>英文写作</span><span>社媒运营</span><span>视频剪辑</span><span>活动策划</span></div>`;
let r=`${deco('୨୧','top:42px;right:42px','bow')}${deco('✿','bottom:80px;left:44px','flower')}<div class="eyebrow" style="text-align:center">A LITTLE ABOUT ANQI</div><figure class="portrait"><div class="tape"></div><div class="frame">${imgSlot(CONFIG.profile,'陈安琪个人照片')}</div><figcaption>Hello, I'm Anqi ♡</figcaption></figure><div class="paper-note" style="max-width:345px;margin:16px auto"><b>AXORA Lighting · 社媒宣传实习</b><p class="note-small">参与品牌海外内容运营、产品英文文案、社媒视觉素材及内容发布。</p><span class="ribbon">OPEN TO OPPORTUNITIES ✦</span></div>`;return leaf(l,'left','01')+leaf(r,'right','01')}
function card(p){return `<button class="work" type="button" data-preview="${esc(p.src)}" data-label="${esc(p.label)}" aria-label="放大查看${esc(p.label)}">${imgSlot(p.src,p.label)}<em>${esc(p.label)} ⤢</em></button>`}
function two(){let p=CONFIG.photos;let l=`${deco('★','right:38px;top:28px')}${deco('🍓','right:24px;bottom:50px','cake')}<div class="eyebrow">02 / SELECTED SOCIAL WORKS</div><h2>AXORA Lighting<br><span style="color:var(--wine)">社媒作品</span></h2><p class="note-small">海外品牌宣传 · 内容策划 · 英文图文<br>点击任意照片，可放大查看细节。</p><div class="tiny-dots"></div><div class="links"><a class="ticket" target="_blank" rel="noopener noreferrer" href="${esc(CONFIG.facebook)}">↗ Facebook</a><a class="ticket" target="_blank" rel="noopener noreferrer" href="${esc(CONFIG.instagram)}">↗ Instagram</a></div><div class="works">${p.slice(0,2).map(card).join('')}</div><p class="note-small">社媒内容包含品牌帖文、图文设计与账号运营实例。</p>`;
let r=`${deco('✿','right:35px;top:23px','flower')}${deco('୨୧','right:43px;bottom:32px','bow')}<div class="eyebrow">CAMPAIGNS / CONTENT / DESIGN</div><div class="photo-caption">A little gallery of my work ♡</div><h2>精选案例 <span style="color:var(--wine)">♡</span></h2><div class="works">${p.slice(2).map(card).join('')}</div><div style="margin-top:17px"><a class="ticket" href="${esc(p[3].url)}" target="_blank" rel="noopener noreferrer">↗ 查看 LinkedIn 帖子（2）原文</a></div><p class="note-small">网站已关闭，相关工作以历史截图为主。</p>`;return leaf(l,'left','02')+leaf(r,'right','02')}
function videoCard(v){return `<a class="video-cover-link" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer" aria-label="在 YouTube 观看${esc(v.title)}"><div class="video-cover-media">${imgSlot(v.cover,v.title+'视频封面')}<span class="video-cover-play" aria-hidden="true">▶</span></div><div class="video-cover-caption"><strong>${esc(v.title)}</strong><span>点击封面播放 ↗</span></div></a>`}

function three(){let l=`${deco('★','top:28px;right:35px')}${deco('📼','bottom:37px;right:30px','cake')}<div class="eyebrow">03 / VIDEO PORTFOLIO</div><h2>Moving<br>Stories ✦</h2><p class="note-small">旅行纪录 · 创意短片 · 城市故事<br>点击图片，在 YouTube 观看完整视频。</p><div class="video-list three-video-list">${CONFIG.videos.map(videoCard).join('')}</div><span class="photo-hero">THREE VIDEOS · THREE STORIES ♡</span>`;

function four(){let l=`${deco('★','top:66px;right:55px')}${deco('✿','bottom:66px;left:55px','flower')}<div class="ending"><div class="eyebrow">04 / THE LAST PAGE</div><h2>Thank you<br>for reading!</h2><p>感谢翻阅我的小小作品集。<br>期待继续探索内容、影像与设计，<br>把灵感变成有温度的作品。</p><span class="ribbon" style="align-self:flex-start">WITH LOVE, ANQI ♡</span></div>`;

let cur=0,busy=false;const book=document.querySelector('#book'),modal=document.querySelector('#modal');const pages=[one,two,three,four];function images(){document.querySelectorAll('[data-img]').forEach(el=>{const i=new Image();i.alt=el.dataset.alt;i.onload=()=>el.replaceChildren(i);i.src=el.dataset.img})}function render(){book.innerHTML=pages[cur]();images();document.querySelector('#counter').textContent=String(cur+1).padStart(2,'0')+' / 04';document.querySelector('#prev').disabled=cur===0;document.querySelector('#next').disabled=cur===3;document.querySelectorAll('[data-preview]').forEach(b=>b.addEventListener('click',()=>{const img=new Image();img.onload=()=>{document.querySelector('#big').src=b.dataset.preview;document.querySelector('#modal-caption').textContent=b.dataset.label;modal.classList.add('open')};img.onerror=()=>alert('未找到图片：'+b.dataset.preview+'\n请检查文件名和图片位置。');img.src=b.dataset.preview}))}function turn(delta){let to=cur+delta;if(busy||to<0||to>=pages.length)return;busy=true;book.classList.add('turn-out');setTimeout(()=>{cur=to;book.classList.remove('turn-out');render();book.classList.add('turn-in');setTimeout(()=>{book.classList.remove('turn-in');busy=false},430)},220)}function close(){modal.classList.remove('open');document.querySelector('#big').removeAttribute('src')}document.querySelector('#prev').onclick=()=>turn(-1);document.querySelector('#next').onclick=()=>turn(1);document.querySelector('#close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.addEventListener('keydown',e=>{if(modal.classList.contains('open')){if(e.key==='Escape')close();return}if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});render();
</script>
